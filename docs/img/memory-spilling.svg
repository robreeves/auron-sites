<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img" aria-labelledby="title desc">
  <title id="title">Auron native, heap, and disk spilling</title>
  <desc id="desc">Native operators serialize state, with compression where used. Eligible spills use Spark-managed JVM heap. If heap storage is unavailable they go directly to local disk; heap spills also move to disk when acquisition fails or Spark reclaims memory. Readback and merging still need working memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526174"/>
    </marker>
  </defs>
  <rect width="480" height="762" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#243447">
    <rect x="48" y="16" width="336" height="82" rx="9" fill="#edf5f0" stroke="#48765b"/>
    <text x="216" y="50" font-size="22" text-anchor="middle" font-weight="600">Native operator state</text>
    <text x="216" y="79" font-size="19" text-anchor="middle">Sort runs, aggregation tables</text>
    <path d="M 352 98 V 162" fill="none" stroke="#526174" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="72" y="137" font-size="18">Operator spills</text>
    <rect x="48" y="174" width="336" height="82" rx="9" fill="#f8fafc" stroke="#64748b"/>
    <text x="216" y="208" font-size="22" text-anchor="middle" font-weight="600">Serialized spill data</text>
    <text x="216" y="237" font-size="19" text-anchor="middle">Compressed where used</text>
    <path d="M 352 256 V 344" fill="none" stroke="#526174" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="72" y="296" font-size="18">Heap storage eligible</text>
    <text x="72" y="322" font-size="18">and memory acquired</text>
    <rect x="48" y="356" width="336" height="88" rx="9" fill="#eaf3fb" stroke="#3972a1"/>
    <text x="216" y="391" font-size="22" text-anchor="middle" font-weight="600">JVM heap spill buffers</text>
    <text x="216" y="422" font-size="19" text-anchor="middle">Accounted to Spark</text>
    <path d="M 352 444 V 548" fill="none" stroke="#526174" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="48" y="482" font-size="18">Acquisition fails, or</text>
    <text x="48" y="508" font-size="18">Spark reclaims heap memory</text>
    <path d="M 384 215 H 440 V 600 H 396" fill="none" stroke="#526174" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="429" y="378" font-size="18" text-anchor="middle" transform="rotate(-90 429 378)">No eligible heap storage</text>
    <rect x="48" y="560" width="336" height="82" rx="9" fill="#f8fafc" stroke="#64748b"/>
    <text x="216" y="594" font-size="22" text-anchor="middle" font-weight="600">Local disk spill file</text>
    <text x="216" y="623" font-size="19" text-anchor="middle">Spark local block directories</text>
    <text x="32" y="691" font-size="19">Spills can be read from heap or disk.</text>
    <text x="32" y="722" font-size="19">Readback and merging still need memory.</text>
    <text x="32" y="747" font-size="17" fill="#526174">A native spill is not necessarily disk I/O.</text>
  </g>
</svg>
