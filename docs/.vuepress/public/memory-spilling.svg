<svg xmlns="http://www.w3.org/2000/svg" width="960" height="776" viewBox="0 0 960 776" role="img" aria-labelledby="title desc">
  <title id="title">Auron spill-storage decision tree</title>
  <desc id="desc">Heap spill storage requires an active Spark task and both Spark on-heap execution-pool usage and JVM committed-heap usage below spark.auron.onHeapSpill.memoryFraction, 90% by default. Each write must then receive a full memory grant from Spark. Otherwise use disk. Heap-backed spills can later move to disk when another grant fails or Spark reclaims memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="776" rx="12" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#334155">
    <g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M 480 92 V 126"/>
      <path d="M 240 228 H 230 V 396"/>
      <path d="M 720 228 H 785 V 676"/>
      <path d="M 230 524 V 676"/>
      <path d="M 380 462 H 785"/>
      <path d="M 380 734 H 631"/>
    </g>
    <rect x="330" y="16" width="300" height="76" rx="8" fill="#d1fae5" stroke="#0f766e" stroke-width="1.5"/>
    <text x="480" y="46" font-size="22" font-weight="bold" fill="#065f46">Native operator spills</text>
    <text x="480" y="76">Choose spill storage</text>
    <g fill="#f8fafc" stroke="#64748b" stroke-width="1.5">
      <rect id="heap-eligibility" x="240" y="130" width="480" height="196" rx="8"/>
      <rect id="heap-acquisition" x="80" y="400" width="300" height="124" rx="8"/>
    </g>
    <g font-weight="bold">
      <text x="480" y="164" font-size="22">1. Is heap storage eligible?</text>
      <text x="230" y="434" font-size="22">2. Does Spark grant</text>
      <text x="230" y="462" font-size="22">enough memory?</text>
    </g>
    <text x="480" y="200">Active Spark task</text>
    <text x="480" y="232">Spark execution-pool usage below threshold</text>
    <text x="480" y="264">JVM committed-heap usage below threshold</text>
    <text x="480" y="302" fill="#64748b">All required. Default threshold: 90%</text>
    <text x="230" y="501">Full grant for this write?</text>
    <g font-size="18" fill="#64748b">
      <text x="248" y="370">Yes</text>
      <text x="756" y="213">No</text>
      <text x="248" y="616">Yes</text>
      <text x="580" y="447">No</text>
      <text x="508" y="656" font-weight="bold">3. Later heap pressure?</text>
      <text x="508" y="686">Grant fails or Spark</text>
      <text x="508" y="710">reclaims memory</text>
    </g>
    <rect id="heap-storage" x="80" y="680" width="300" height="84" rx="8" fill="#d1fae5" stroke="#0f766e" stroke-width="1.5"/>
    <rect id="disk-storage" x="635" y="680" width="300" height="84" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="230" y="712" font-size="22" font-weight="bold" fill="#065f46">JVM heap spill buffers</text>
    <text x="230" y="744">Accounted to Spark</text>
    <text x="785" y="712" font-size="22" font-weight="bold">Local disk spill file</text>
    <text x="785" y="744">Spark local directories</text>
  </g>
</svg>
